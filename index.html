<h2>Teacher's Score</h2>

<form id="scoreForm">
  <input type="number" id="score" name="score" placeholder="Enter score here" required><br><br>
  <input type="text" id="comment" name="comment" placeholder="Additional comment (optional)"><br><br>
  <button type="submit">Submit</button>
</form>

<p id="feedback"></p>

<script>
  const form = document.getElementById('scoreForm');
  const feedback = document.getElementById('feedback');

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    const formData = new FormData(form);

    try {
      const response = await fetch("https://formspree.io/f/mnpnqkdq", {
        method: "POST",
        body: formData,
        headers: { 'Accept': 'application/json' }
      });

      if (response.ok) {
        feedback.textContent = "Score submitted successfully!";
        feedback.style.color = "green";
        form.reset();
      } else {
        feedback.textContent = "Something went wrong. Please try again.";
        feedback.style.color = "red";
      }
    } catch (error) {
      feedback.textContent = "Error submitting score. Check your connection.";
      feedback.style.color = "red";
    }
  });
</script>
